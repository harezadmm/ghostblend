[package]
name = "ghostblend"
version = "0.1.0"
edition = "2024"
description = "Headless Blender for AI agents, with a built-in MCP server. Brings its own Blender engine."
repository = "https://github.com/harezadmm/ghostblend"
readme = "README.md"
keywords = ["blender", "mcp", "headless", "3d", "ai-agent"]
categories = ["graphics", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
regex = "1.13.1"
reqwest = "0.13.5"
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time", "sync", "fs", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.26.1", features = ["v4"] }
which = "8.0.6"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
